/* Thuisscherm: quiet luxury. Kalkwit, steen, zwart, één gedempt brons-accent; zachte glasvlakken. */
:root{
  --achtergrond:#141312;                         /* de schermachtergrond; klok en meters gebruiken exact deze kleur (geen eigen plaatkleur) */
  --bg:var(--achtergrond); --tekst:#ebe7de; --zacht:rgba(235,231,222,.58); --glas:rgba(31,29,27,.96); --rand:rgba(255,252,245,.13);
  --accent:#b0905f; --accent-d:#8c6f45; --knop:rgba(255,252,245,.07); --schaduw:none; --vlak:rgba(31,29,27,.96);
  --klokzwart:#0d0d0c; --klokwit:#ede8df;
  --dur-snel:160ms; --dur:280ms; --dur-traag:600ms; --ease:cubic-bezier(.2,.7,.2,1);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; overflow:hidden; background:#141312; overscroll-behavior:none; }
body{ font-family:"Outfit",-apple-system,sans-serif; font-weight:300; font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
#app{ position:fixed; left:0; top:0; right:0; bottom:0; display:flex; flex-direction:column; background:var(--bg); color:var(--tekst);
  transition:background-color var(--dur-traag) var(--ease), color var(--dur-traag) var(--ease);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

.glas{ background:var(--glas); border:1px solid var(--rand); border-radius:5px;  box-shadow:var(--schaduw); }

/* kop */
.balk{ position:absolute; left:0; right:0; top:0; z-index:6; height:56px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:0 24px; pointer-events:none; }
.balk > *{ pointer-events:auto; }
.merk{ display:flex; align-items:center; gap:12px; }
.titel{ font-size:20px; font-weight:300; letter-spacing:.14em; text-transform:uppercase; }
.modus{ font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--zacht); border:0; padding:0; opacity:.7; }
.scenariowrap{ position:relative; }
.scenes{ position:absolute; right:0; top:38px; width:290px; padding:8px; display:flex; flex-direction:column; gap:4px; z-index:30;
  opacity:0; visibility:hidden; transform:translateY(-8px) scale(.98); transform-origin:100% 0; transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease), visibility 0s linear var(--dur); }
.scenes.open{ opacity:1; visibility:visible; transform:none; transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
.scrij{ display:flex; align-items:stretch; gap:4px; }
.sctegel{ flex:1 1 auto; text-align:left; border-radius:4px; border:1px solid transparent; background:transparent; padding:11px 14px; min-height:44px; font-size:15px; letter-spacing:.06em; cursor:pointer; color:inherit; }
.sctegel:active{ background:var(--accent); color:#fff; }
.sctegel.nieuw{ margin-top:4px; border:1px dashed var(--rand); color:var(--zacht); text-align:center; }
.scpot{ flex:0 0 44px; width:44px; border-radius:4px; border:0; background:transparent; color:var(--zacht); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.scpot svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.scpot:active{ color:var(--accent); }
.klimaat button, .paneel button.pil{ background:var(--knop); border:1px solid var(--rand); border-radius:999px;
  padding:9px 20px; min-height:40px; font-size:15px; cursor:pointer; transition:background-color var(--dur-snel); }
.klimaat button:active, .paneel button.pil:active{ background:var(--accent); color:#fff; }

/* midden */
.stagevak{ position:absolute; left:0; right:0; top:44px; bottom:190px; overflow:visible; }
/* zijkolommen: zweven over de lege hoeken van het beeld, bovenaan */
.stage{ position:absolute; left:0; top:0; width:100%; height:100%; overflow:hidden; transition:width var(--dur-traag) var(--ease), height var(--dur-traag) var(--ease), left var(--dur-traag) var(--ease), top var(--dur-traag) var(--ease); }
.zoom{ position:absolute; left:0; top:0; width:100%; height:100%; transform-origin:0 0; transition:transform var(--dur-traag) var(--ease); }
#snap, #regen{ position:absolute; left:0; top:0; width:100%; height:100%; display:block; pointer-events:none; }
#regen{ opacity:.3; }
#doek{ position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
.geenwebgl{ position:absolute; left:0; top:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; color:var(--zacht); text-align:center; padding:30px; }

/* bolletjes: enkel in de ingezoomde kamer (klasse inkamer); tikzone 48 px op het scherm, bolletje ±14 px; --ks = 1/zoom houdt ze even groot */
.hotspot{ opacity:0; pointer-events:none; transition:left var(--dur) var(--ease), top var(--dur) var(--ease), opacity var(--dur-traag); position:absolute; width:calc(48px * var(--ks,1)); height:calc(48px * var(--ks,1)); margin:calc(-24px * var(--ks,1)) 0 0 calc(-24px * var(--ks,1)); padding:0; border:0; background:transparent; cursor:pointer; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
.hotspot::after{ content:""; position:absolute; left:50%; top:50%; width:calc(14px * var(--ks,1)); height:calc(14px * var(--ks,1)); margin:calc(-7px * var(--ks,1)) 0 0 calc(-7px * var(--ks,1)); border-radius:50%;
  border:calc(1.5px * var(--ks,1)) solid rgba(255,252,245,.6); background:rgba(0,0,0,.25); transition:all var(--dur); }
.hotspot.aan::after{ background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 calc(4px * var(--ks,1)) rgba(176,144,95,.22); }
.hotspot.kiezen::after{ width:calc(22px * var(--ks,1)); height:calc(22px * var(--ks,1)); margin:calc(-11px * var(--ks,1)) 0 0 calc(-11px * var(--ks,1)); border-color:var(--accent); }
.hotspot.los::after{ border-style:dashed; }
.hotlijnen{ position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
.kamerpuls{ position:absolute; transform:translate(-50%,-50%); border-radius:50%; pointer-events:none; background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,214,160,.34) 0%, rgba(255,214,160,.12) 55%, rgba(255,214,160,0) 100%); opacity:0; animation:kamerpuls .9s var(--ease) forwards; }
.kamerpuls.uit{ background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,252,245,.12) 0%, rgba(255,252,245,.04) 55%, rgba(255,252,245,0) 100%); }
@keyframes kamerpuls{ 0%{ opacity:0; } 25%{ opacity:1; } 100%{ opacity:0; } }
.kamerkop{ position:absolute; left:50%; top:4px; transform:translateX(-50%); z-index:6; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--zacht); pointer-events:none; white-space:nowrap; }
.stage, .zoom{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
.kamerlabel{ opacity:0; pointer-events:none; transition:left var(--dur) var(--ease), top var(--dur) var(--ease), opacity var(--dur-traag); position:absolute; transform:translate(-50%,-50%) scale(var(--ks,1)); padding:5px 12px; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
  background:var(--glas); border:1px solid var(--rand); border-radius:4px; color:var(--tekst);  cursor:pointer; white-space:nowrap; }
.kamerlabel.aan{ border-color:var(--accent); color:var(--accent); }
.kamerlabel:active{ background:var(--accent); color:#fff; }

/* lamppaneel */
.paneel{ position:absolute; width:260px; padding:16px 18px 18px; z-index:5; }
.paneel .kop{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.paneel .naam{ font-size:15px; font-weight:500; }
.paneel .sluit{ background:none; border:0; font-size:20px; color:var(--zacht); padding:2px 8px; cursor:pointer; }
.paneel .rij{ margin-top:14px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--zacht); }
.paneel .aanuit{ width:100%; }
.paneel .aanuit.aan{ background:var(--accent); border-color:var(--accent); color:#fff; }
.kleuren{ display:flex; gap:8px; margin-top:8px; }
.kleuren button{ width:34px; height:34px; border-radius:50%; border:1px solid var(--rand); padding:0; cursor:pointer; }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:28px; background:transparent; margin:4px 0 0; }
input[type=range]::-webkit-slider-runnable-track{ height:3px; border-radius:2px; background:var(--rand); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; margin-top:-11.5px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); }
.warmkoel::-webkit-slider-runnable-track{ background:linear-gradient(90deg,#d9a766,#efe9dd,#b9cde0); }

/* rand */
.kaart{ padding:14px 16px; }
.kaart h2{ margin:0 0 6px; font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--zacht); }
.groot{ font-size:32px; font-weight:200; line-height:1.1; }
.klein{ font-size:12px; color:var(--zacht); margin-top:2px; }
.titelregel{ font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.knoppen{ display:flex; gap:8px; margin-top:10px; }
.knoppen button{ padding:7px 14px; min-height:36px; font-size:14px; flex:1 1 auto; }
.schuifrij{ display:block; margin-top:8px; font-size:12px; color:var(--zacht); }
.klimaat{ display:flex; align-items:center; justify-content:space-between; }
.klimaat button{ width:44px; height:44px; padding:0; font-size:22px; line-height:1; }
.klimaat > div{ text-align:center; }

/* temperatuur: twee kleine cirkels */
.cirkels{ display:flex; gap:10px; }

.ikon{ width:34px; height:34px; padding:0; border-radius:50%; border:1px solid rgba(255,252,245,.22); background:rgba(255,252,245,.08); color:#f1ede4; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.ikon.groot{ width:40px; height:40px; background:var(--accent); border-color:var(--accent); color:#fff; }
.ikon:active{ transform:scale(.93); }
.ikon svg{ width:18px; height:18px; fill:currentColor; display:block; }

/* volumebalk: dik, afgerond, vult met brons, veert bij loslaten */
.vb{ position:relative; height:26px; border-radius:13px; background:rgba(255,252,245,.14); overflow:hidden; cursor:pointer; touch-action:none; }
.vb-vul{ position:absolute; left:0; top:0; bottom:0; width:30%; border-radius:inherit; background:linear-gradient(90deg, #8c6f45, #b0905f); }
.vb.veer .vb-vul{ transition:width .5s cubic-bezier(.34,1.7,.5,1); }
.vb-pct{ position:absolute; right:12px; top:0; bottom:0; display:flex; align-items:center; font-size:12px; letter-spacing:.04em; color:#f1ede4; opacity:0; transition:opacity var(--dur); text-shadow:0 1px 3px rgba(0,0,0,.4); pointer-events:none; }
.vb.sleept .vb-pct, .vb.toon .vb-pct{ opacity:.9; }
.vb.sleept .vb-vul{ filter:brightness(1.08); }

/* schermvullende speler */
.speler{ position:absolute; left:0; top:0; right:0; bottom:0; z-index:20; display:flex; align-items:center; justify-content:center; overflow:hidden;
  background:#161513; opacity:0; transition:opacity var(--dur) var(--ease); touch-action:none; -webkit-user-select:none; user-select:none; }
.speler.zichtbaar{ opacity:1; }
.sp-bg{ position:absolute; left:-10%; top:-10%; width:120%; height:120%; object-fit:cover; -webkit-filter:blur(48px) brightness(.45) saturate(.9); filter:blur(48px) brightness(.45) saturate(.9); pointer-events:none; }
.sp-inhoud{ position:relative; z-index:1; width:min(440px, 80%); display:flex; flex-direction:column; align-items:center; color:#ebe7de; text-align:center; transform:scale(.96); transition:transform var(--dur) var(--ease); }
.speler.zichtbaar .sp-inhoud{ transform:none; }
.speler.sleept .sp-inhoud, .speler.sleept .sp-hoes{ transition:none !important; }
.sp-hoes{ width:min(46vh, 380px); height:min(46vh, 380px); border-radius:14px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.5); background:linear-gradient(135deg, #a49c8c, #4a4640); will-change:transform; }
.sp-hoes img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.sp-titel{ margin-top:22px; font-size:22px; font-weight:400; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp-artiest{ margin-top:4px; font-size:15px; color:rgba(235,231,222,.62); }
.sp-speel{ margin-top:18px; }
.sp-vb{ margin-top:10px; }

.toast{ position:absolute; left:50%; bottom:calc(var(--onder, 24px) + 60px); transform:translateX(-50%); background:rgba(20,19,17,.88); color:#ebe7de; padding:10px 20px; border-radius:999px; font-size:14px; z-index:9; }


@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ transition-duration:0s !important; transition-delay:0s !important; animation-duration:0s !important; animation-iteration-count:1 !important; }
}

/* Jost voor display: titels, grote cijfers, labels (licht, ruime letter-spacing, micro-labels in hoofdletters) */
.titel, .c-groot, .c-label, .modus, .kamerlabel, .scenarioknop, .scenes button,
.paneel .naam, .paneel .rij, .muz-titel, .muz-artiest, .sp-titel, .sp-artiest, .vb-pct, .toast{
  font-family:"Jost",-apple-system,sans-serif; font-variant-numeric:tabular-nums; }
.titel, .c-groot, .sp-titel{ font-weight:300; }
.c-groot{ letter-spacing:.02em; }
.muz-titel, .paneel .naam, .kamerlabel, .modus{ font-weight:400; }
.c-label, .muz-artiest, .sp-artiest, .scenarioknop, .scenes button, .vb-pct, .toast{ font-weight:300; letter-spacing:.08em; }
.c-label, .paneel .rij{ text-transform:uppercase; letter-spacing:.14em; font-size:10px; }
.sp-titel{ letter-spacing:.06em; }

/* draaiknop: tweede aanzicht */
.draai{ position:absolute; right:16px; bottom:14px; width:46px; height:46px; padding:0; border-radius:50%; z-index:6; cursor:pointer; color:var(--tekst);
  background:var(--glas); border:1px solid var(--rand);  box-shadow:var(--schaduw); display:flex; align-items:center; justify-content:center; }
.draai svg{ width:22px; height:22px; }
.draai:active{ background:var(--accent); color:#fff; }

/* scenario bewerken / bewaren */
.sceditor{ position:absolute; left:16px; bottom:16px; width:310px; padding:16px 18px 18px; z-index:12; max-height:calc(100% - 100px); overflow:auto; }
.sceditor .ed-kop{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.sceditor .ed-titel{ font-family:"Jost",-apple-system,sans-serif; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--zacht); }
.sceditor .sluit{ background:none; border:0; font-size:20px; color:var(--zacht); padding:2px 8px; cursor:pointer; }
.sceditor input[type=text], .sceditor input[type=number]{ width:100%; margin-top:8px; padding:10px 12px; font:inherit; font-size:15px; color:var(--tekst); background:var(--knop); border:1px solid var(--rand); border-radius:4px; outline:none; -webkit-user-select:text; user-select:text; }
.sceditor input:focus{ border-color:var(--accent); }
.sceditor .ed-hint{ margin-top:10px; font-size:12px; color:var(--zacht); line-height:1.4; }
.sceditor .ed-rij{ margin-top:14px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--zacht); display:flex; align-items:center; gap:8px; }
.sceditor .ed-keuze{ display:flex; gap:6px; margin-top:8px; }
.sceditor .ed-keuze button{ flex:1; padding:8px 6px; border-radius:999px; border:1px solid var(--rand); background:var(--knop); font-size:13px; cursor:pointer; }
.sceditor .ed-keuze button.aan{ background:var(--accent); border-color:var(--accent); color:#fff; }
.sceditor .ed-knoppen{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
.sceditor .ed-knoppen button{ flex:1 1 auto; padding:10px 14px; border-radius:999px; border:1px solid var(--rand); background:var(--knop); font-size:14px; cursor:pointer; }
.sceditor .ed-knoppen button.hoofd{ background:var(--accent); border-color:var(--accent); color:#fff; }
.sceditor .ed-knoppen button.gevaar{ color:var(--zacht); }
.sceditor .ed-rij span{ text-transform:none; letter-spacing:0; font-size:11px; }

/* labels en bolletjes: enkel zichtbaar na aanraking van het beeld (±6 s) */
#app .hotspot.inkamer{ opacity:1; pointer-events:auto; }
#app .hotspot.inkamer.los{ opacity:.4; pointer-events:none; }       /* zonder koppeling: subtiel zichtbaar, niet tikbaar */
.kamerlabel.weg{ display:none; }

/* rustmodus: na 30 s zonder aanraking vervagen alle widgets; enkel het appartement (en een kleine klok) blijft */
.zij .cirkels, .zij.rechts, .scenariowrap, .draai, .balk .merk, .terug, .status{ transition:opacity var(--dur-traag) var(--ease), transform var(--dur-traag) var(--ease); }
#app.rust .zij .cirkels, #app.rust .scenariowrap, #app.rust .draai, #app.rust .balk .merk, #app.rust .terug, #app.rust .hotspot, #app.rust .kamerlabel{ opacity:0 !important; pointer-events:none !important; }

/* terug-pijltje bij inzoomen */
.terug{ position:absolute; left:16px; bottom:14px; width:46px; height:46px; padding:0; border-radius:50%; z-index:6; cursor:pointer; color:var(--tekst);
  background:transparent; border:1px solid rgba(255,252,245,.16); box-shadow:none; display:flex; align-items:center; justify-content:center; opacity:.7; }
.terug svg{ width:18px; height:18px; }
.terug:active{ background:var(--knop); }

/* verbindingsstatus: enkel zichtbaar bij een probleem */
.status{ position:absolute; right:22px; top:46px; z-index:7; display:flex; align-items:center; gap:8px; font-family:"Jost",-apple-system,sans-serif; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--zacht); pointer-events:none; }
.status .stip{ width:7px; height:7px; border-radius:50%; background:var(--tekst); opacity:.45; }

/* tijdschuif en secties in het scenario-menu */
.scenes{ max-height:calc(100vh - 150px); overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
.schead{ margin:12px 14px 2px; font-family:"Jost",-apple-system,sans-serif; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--zacht); }
.daglicht{ padding:2px 14px 8px; }
.daglicht .dl-kop{ display:flex; justify-content:space-between; font-size:13px; color:var(--zacht); letter-spacing:.06em; }
.daglicht input[type=range]{ margin-top:2px; }
.schakel{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 14px; font-size:14px; letter-spacing:.04em; cursor:pointer; }
.schakel .sw{ flex:0 0 40px; width:40px; height:24px; border-radius:12px; background:var(--knop); border:1px solid var(--rand); position:relative; transition:background-color var(--dur); }
.schakel .sw::after{ content:""; position:absolute; left:2px; top:2px; width:18px; height:18px; border-radius:50%; background:var(--tekst); opacity:.7; transition:transform var(--dur), background-color var(--dur), opacity var(--dur); }
.schakel.aan .sw{ background:var(--accent); border-color:var(--accent); }
.schakel.aan .sw::after{ transform:translateX(16px); background:#fff; opacity:1; }



/* Scenario's: een rustig tekstlabel in de micro-labelstijl, bij aanraken en geopend helder */
.scenarioknop{ background:none; border:0; border-radius:0; box-shadow:none; padding:10px 18px; min-height:0; font-family:"Jost",-apple-system,sans-serif; font-size:11px; font-weight:400;
  letter-spacing:.24em; text-transform:uppercase; color:var(--tekst); opacity:.55; cursor:pointer; transition:opacity var(--dur); -webkit-appearance:none; appearance:none; }
.scenarioknop:active, .scenarioknop[aria-expanded=true]{ opacity:1; background:none; color:var(--tekst); }
.scenes{ top:38px; }

/* wifi voor gasten */
.wifipaneel{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:14; padding:16px 22px 22px; text-align:center; max-width:340px; }
.wifipaneel .wp-kop{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; min-width:230px; }
.wifipaneel .wp-titel{ font-family:"Jost",-apple-system,sans-serif; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--zacht); }
.wifipaneel .sluit{ background:none; border:0; font-size:22px; color:var(--zacht); padding:2px 8px; cursor:pointer; }
.wifipaneel .wp-qr{ width:230px; height:230px; margin:0 auto; border-radius:12px; overflow:hidden; background:#fff; padding:0; }
.wifipaneel .wp-qr svg{ display:block; width:100%; height:100%; }
.wifipaneel .wp-ssid{ margin-top:12px; font-family:"Jost",-apple-system,sans-serif; font-size:15px; letter-spacing:.06em; }
.wifipaneel .wp-hint{ margin-top:6px; font-size:12px; color:var(--zacht); line-height:1.4; }
.tvinfo{ margin-top:10px; font-size:12px; color:var(--zacht); }

/* maquette in de ruimte: zachte contactschaduw onder het model, vignet in de achtergrond en een bijna onzichtbare film-korrel (niet over het beeld) */
.contact{ position:absolute; left:14%; top:60%; width:72%; height:34%; pointer-events:none;
  background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(11,10,9,.7) 0%, rgba(11,10,9,.36) 45%, rgba(11,10,9,0) 100%); }
.dag .contact{ background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(11,10,9,.45) 0%, rgba(11,10,9,.2) 45%, rgba(11,10,9,0) 100%); }

/* kleine radii in de panelen (haarlijnen, geen pillen) */
.sceditor .ed-keuze button, .sceditor .ed-knoppen button, .paneel button.pil, .klimaat button{ border-radius:4px; }
.wifipaneel .wp-qr{ border-radius:4px; }

/* onderaan in het midden: het muziekblok (enkel als er iets speelt of gepauzeerd is) */
.muziekblok{ position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:5; display:flex; align-items:center; gap:22px; width:max-content; max-width:calc(100% - 40px);
  transform-origin:50% 100%; transition:transform var(--dur-traag) var(--ease), opacity var(--dur-traag) var(--ease); }
.muziekblok[hidden]{ display:none; }
.mb-hoes{ position:relative; flex:0 0 132px; width:132px; height:132px; padding:0; border:0; border-radius:4px; overflow:hidden; cursor:pointer;
  background:linear-gradient(135deg, rgba(160,152,138,.55), rgba(70,66,60,.7)); box-shadow:0 18px 30px -12px rgba(0,0,0,.65), 0 4px 10px -4px rgba(0,0,0,.4); }
.mb-hoes img{ position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity var(--dur-traag) var(--ease); pointer-events:none; }
.mb-hoes img.zichtbaar{ opacity:1; }
.mb-tekst{ flex:1 1 auto; min-width:150px; max-width:260px; }
.mb-titel{ font-family:"Jost",-apple-system,sans-serif; font-weight:300; font-size:26px; line-height:1.15; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mb-titel.nieuw{ animation:mbIn var(--dur-traag) var(--ease); }
@keyframes mbIn{ from{ opacity:0; transform:translateX(10px); } to{ opacity:1; transform:none; } }
.mb-artiest{ margin-top:6px; font-family:"Jost",-apple-system,sans-serif; font-weight:400; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--zacht); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mb-voortgang{ display:flex; align-items:center; gap:10px; margin-top:16px; font-family:"Jost",-apple-system,sans-serif; font-size:11px; letter-spacing:.06em; color:var(--zacht); font-variant-numeric:tabular-nums; }
.mb-voortgang[hidden]{ display:none; }
.mb-lijn{ flex:1 1 auto; height:1px; background:var(--rand); position:relative; }
.mb-lijn #mb-vul{ position:absolute; left:0; top:-0.5px; height:2px; width:0; background:var(--accent); }
.mb-bediening{ display:flex; align-items:center; gap:12px; flex:0 0 auto; }
.mb-speel{ width:52px; height:52px; padding:0; border-radius:50%; border:1px solid var(--tekst); background:transparent; color:var(--tekst); display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:.9; }
.mb-speel:active{ background:var(--accent); border-color:var(--accent); color:#fff; }
.mb-klein{ width:34px; height:34px; padding:0; border-radius:50%; border:0; background:transparent; color:var(--zacht); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.mb-klein:active{ color:var(--tekst); }
.mb-speel svg{ width:20px; height:20px; fill:currentColor; display:block; }
.mb-klein svg{ width:16px; height:16px; fill:currentColor; display:block; }
.mb-bediening .dialhost{ margin:0 0 0 8px; }
/* rustmodus: enkel de hoes en de titel, klein en gedimd; de bediening verschijnt weer bij aanraken */
.mb-tekst, .mb-bediening{ transition:opacity var(--dur-traag) var(--ease); }
#app.rust .muziekblok{ transform:translateX(-50%) scale(.6); opacity:.6; pointer-events:none; }
#app.rust .mb-bediening, #app.rust .mb-artiest, #app.rust .mb-voortgang{ opacity:0; }
#app.rust .mb-tekst{ min-width:0; }

/* OTTO luistert: een heel dunne bronzen lijn over de volle breedte onderaan, ademt traag; het antwoord is rustige tekst */
.luisterlijn{ position:absolute; left:0; right:0; bottom:0; height:2px; z-index:8; pointer-events:none; opacity:0; background:var(--accent);
  box-shadow:0 0 14px 2px rgba(176,144,95,.55); transition:opacity var(--dur-traag) var(--ease); }
.luisterlijn.aan{ opacity:.9; animation:ademlijn 3.2s ease-in-out infinite; }
@keyframes ademlijn{ 0%,100%{ opacity:.35; box-shadow:0 0 8px 1px rgba(176,144,95,.35); } 50%{ opacity:1; box-shadow:0 0 18px 3px rgba(176,144,95,.6); } }
.antwoord{ position:absolute; left:50%; bottom:calc(var(--onder, 24px) + 14px); transform:translateX(-50%); z-index:8; max-width:min(640px, calc(100% - 60px)); text-align:center;
  font-family:"Outfit",-apple-system,sans-serif; font-weight:300; font-size:18px; line-height:1.4; letter-spacing:.01em; animation:mbIn var(--dur-traag) var(--ease); pointer-events:none; }
.antwoord[hidden]{ display:none; }
/* sober pinpaneel (enkel als OTTO om ontgrendelen vraagt) */
.pinpaneel{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:15; padding:16px 20px 20px; text-align:center; width:230px; }
.pinpaneel .pp-kop{ font-family:"Jost",-apple-system,sans-serif; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--zacht); margin-bottom:12px; }
.pinpaneel .pp-stippen{ height:18px; display:flex; justify-content:center; gap:10px; margin-bottom:12px; }
.pinpaneel .pp-stippen i{ width:9px; height:9px; border-radius:50%; border:1px solid var(--tekst); opacity:.5; }
.pinpaneel .pp-stippen i.vol{ background:var(--tekst); opacity:1; }
.pinpaneel .pp-rooster{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
.pinpaneel button{ height:44px; border-radius:4px; border:1px solid var(--rand); background:transparent; font:inherit; font-size:18px; font-weight:300; cursor:pointer; color:var(--tekst); }
.pinpaneel button:active{ background:var(--accent); color:#fff; }
.pinpaneel .pp-fout{ margin-top:10px; font-size:12px; color:var(--zacht); min-height:14px; }


/* kop: Scenario's rechtsboven, de demo-badge onder de meters links */
.scenariowrap{ grid-column:3; justify-self:end; }
.balk .merk{ position:absolute; left:24px; top:18px; }

/* timers */
.timerpaneel{ position:absolute; left:50%; bottom:196px; transform:translateX(-50%); z-index:14; padding:10px 12px; min-width:230px; }
.timerpaneel .tp-rij{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:4px 2px; font-size:14px; font-variant-numeric:tabular-nums; }
.timerpaneel .tp-naam{ color:var(--zacht); font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-family:"Jost",-apple-system,sans-serif; }
.timerpaneel button{ padding:7px 14px; border-radius:4px; border:1px solid var(--rand); background:transparent; font:inherit; font-size:13px; cursor:pointer; color:var(--tekst); }
.timerpaneel button:active{ background:var(--accent); color:#fff; }
.timerpaneel .tp-alles{ width:100%; margin-top:6px; }

/* muziekblok exact in het midden: de hoes op de middenas, tekst rechts uitgelijnd links ervan, bediening en volumemeter rechts ervan (symmetrisch) */
.muziekblok{ display:grid; grid-template-columns:1fr 132px 1fr; grid-template-areas:"tekst hoes bediening"; column-gap:22px; align-items:center; width:min(900px, calc(100% - 40px)); max-width:none; }
.muziekblok .mb-hoes{ grid-area:hoes; }
.muziekblok .mb-tekst{ grid-area:tekst; text-align:right; min-width:0; max-width:none; }
.muziekblok .mb-bediening{ grid-area:bediening; justify-self:start; }

/* dashboard onderaan in het midden (±170 px hoog): één rij ronde meters; de hoes van wat speelt staat helemaal bovenaan in het midden */
.dashboard{ position:absolute; left:0; right:0; bottom:12px; height:170px; z-index:5; display:flex; align-items:center; justify-content:center; gap:18px; transition:opacity var(--dur-traag) var(--ease); }
#app.rust .dashboard{ opacity:.55; }
body.nacht #app.rust .dashboard{ opacity:.3; }
.muziekkop{ position:absolute; left:50%; top:10px; transform:translateX(-50%); z-index:6; display:flex; flex-direction:column; align-items:center; gap:7px; transform-origin:50% 0;
  transition:transform var(--dur-traag) var(--ease), opacity var(--dur-traag) var(--ease); }
.muziekkop[hidden]{ display:none; }
.mk-rij{ position:relative; width:112px; height:112px; }
.muziekkop .mb-hoes{ flex:none; width:112px; height:112px; box-shadow:0 18px 30px -12px rgba(0,0,0,.7), 0 5px 12px -5px rgba(0,0,0,.45); }
.mk-speel{ position:absolute; left:calc(100% + 14px); top:50%; margin-top:-17px; width:34px; height:34px; padding:0; border-radius:50%; border:1px solid var(--rand); background:transparent; color:var(--tekst); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.mk-speel:active{ background:var(--accent); border-color:var(--accent); color:#fff; }
.mk-speel svg{ width:14px; height:14px; fill:currentColor; display:block; }
.mk-titel{ max-width:240px; font-family:"Jost",-apple-system,sans-serif; font-weight:300; font-size:14px; letter-spacing:.04em; color:var(--tekst); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }
.mk-titel.nieuw{ animation:mbIn var(--dur-traag) var(--ease); }
#app.rust .muziekkop{ opacity:.6; transform:translateX(-50%) scale(.75); pointer-events:none; }
#app.rust .mk-speel{ opacity:0; }

/* draai-icoon: een haarlijn op ±50 % dekking, in rust weg */
.draai{ width:40px; height:40px; background:transparent; box-shadow:none; opacity:.5; border:1px solid var(--rand); }
.draai svg{ width:18px; height:18px; }
.draai:active{ opacity:1; }

/* donkerder achtergrond (#141312): crème iets terug zodat klok en meters niet te hard worden */
html:root{ --mt-wit:#E6E1D8; }

/* Thuisscherm: klok en meters (meters.js). Vector-SVG, monochroom crème op de schermachtergrond: geen plaat, geen kleur, geen gloed. */
:root{
  --mt-wit:#EDE8DF;        /* crème voor rand, streepjes, cijfers, wijzers en naalden; secundaire streepjes op 45 % dekking */
}
.mt{ position:relative; display:inline-block; vertical-align:top; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
.mt svg{ display:block; width:100%; height:100%; overflow:visible; shape-rendering:geometricPrecision; text-rendering:geometricPrecision; }
.mt-tekst{ font-family:"Jost","Helvetica Neue",Arial,sans-serif; font-weight:500; }
.mt-cijfer{ letter-spacing:-0.04em; }
.mt-label{ letter-spacing:0.28em; }
.mt-sub{ letter-spacing:0; }
.mt-sec{ -webkit-transition:opacity .4s; transition:opacity .4s; }
.mt-nacht svg{ opacity:.55; }
.mt-nacht .mt-sec{ opacity:0; }

/* dashboard: absolute plekken in een vaste doos; de klok ligt bovenop, de buitenste meters onderaan */
.mt-dashboard{ position:relative; display:block; margin:0 auto; }
.mt-dashboard .mt-plek{ position:absolute; }

<script>
/* Thuisscherm: de pure functies (geen DOM, geen WebGL). Werkt in de browser (window.ThuisKern) en in node (test/thuis.test.js).
   Bewust ES2017-stijl: moet draaien in Safari 15 (iPad Air 2). */
(function (root, fabriek) {
  var k = fabriek();
  if (typeof module === 'object' && module.exports) module.exports = k;
  else root.ThuisKern = k;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var klem = function (x, a, b) { return x < a ? a : (x > b ? b : x); };

  /* ── kleur ── */

  // Kleurtemperatuur (K) naar sRGB 0..255 (benadering van Tanner Helland, geldig 1000..40000 K).
  function kelvinNaarRgb(kelvin) {
    var t = klem(Number(kelvin) || 2700, 1000, 40000) / 100, r, g, b;
    r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
    g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
    b = t >= 66 ? 255 : (t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307);
    return { r: Math.round(klem(r, 0, 255)), g: Math.round(klem(g, 0, 255)), b: Math.round(klem(b, 0, 255)) };
  }

  function srgbNaarLineair(c) {                         // c in 0..1
    c = klem(c, 0, 1);
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);

  function lineairNaarSrgb(c) {
    c = Math.max(c, 0);
    c = c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
    return klem(c, 0, 1);
  }

  // Zachte tonemap: identiek tot de knik, daarna een vloeiende schouder naar 1 (zelfde formule als de fragment shader).
  var KNIK = 0.6;
  function tonemap(x) {
    if (x <= KNIK) return Math.max(x, 0);
    return KNIK + (1 - KNIK) * (1 - Math.exp(-(x - KNIK) / (1 - KNIK)));

  function lampKleurLineair(lamp) {
    var rgb = lamp && lamp.kleur && isFinite(lamp.kleur.r) ? lamp.kleur

    return [srgbNaarLineair(rgb.r / 255), srgbNaarLineair(rgb.g / 255), srgbNaarLineair(rgb.b / 255)];

  /* ── dag en avond ── */

  var ZONSOPGANG = 7 * 60 + 30, ZONSONDERGANG = 18 * 60 + 30, OVERGANG = 60;   // minuten sinds middernacht; voorlopig vast
  function sm(x) { x = klem(x, 0, 1); return x * x * (3 - 2 * x); }

  function dagFactor(minuten) {
    var m = ((minuten % 1440) + 1440) % 1440;
    var op = sm((m - (ZONSOPGANG - OVERGANG / 2)) / OVERGANG);
    var onder = sm((m - (ZONSONDERGANG - OVERGANG / 2)) / OVERGANG);
    return klem(op - onder, 0, 1);
  }

  /* ── lampen ── */

  // Koppelt de toestand van Home Assistant aan lamp-id's via de mapping { lampId: "light.entity" }.
  // Geeft { lampId: {aan, helderheid 0..100, kelvin, kleur, kan} } voor elke gekoppelde lamp die HA kent.
  function koppel(toestand, mapping) {
    var perEntiteit = {}, uit = {}, lijst = (toestand && toestand.lampen) || [];
    lijst.forEach(function (l) { perEntiteit[l.id] = l; });
    Object.keys(mapping || {}).forEach(function (id) {
      var l = perEntiteit[mapping[id]];
      if (l) uit[id] = { aan: !!l.aan, helderheid: l.helderheid || 0, kelvin: l.kelvin || null, kleur: l.kleur || null,
        kan: l.kan || { dimmen: false, wit: false, kleur: false } };
    });
    return uit;
  }

  // Past `volgt` toe: een lamp die andere lampen volgt (bad_led) is aan zodra één ervan aan is, met hun maximale helderheid
  // en de tint van de eerste die aan is. Geeft een nieuw object; het origineel blijft ongemoeid.
  function pasVolgtToe(lampDefs, staat) {
    var uit = {};
    Object.keys(staat).forEach(function (id) { uit[id] = staat[id]; });
    Object.keys(lampDefs).forEach(function (id) {
      var v = lampDefs[id].volgt;
      if (!v || !v.length) return;
      var aanLampen = v.map(function (x) { return uit[x]; }).filter(function (l) { return l && l.aan; });
      if (!aanLampen.length) { uit[id] = { aan: false, helderheid: 0, kelvin: null, kleur: null, kan: { dimmen: false, wit: false, kleur: false }, volgt: true }; return; }
      var max = 0; aanLampen.forEach(function (l) { max = Math.max(max, l.helderheid); });
      uit[id] = { aan: true, helderheid: max, kelvin: aanLampen[0].kelvin, kleur: aanLampen[0].kleur,
        kan: { dimmen: false, wit: false, kleur: false }, volgt: true };
    });
    return uit;
  }

  // Het licht per lamp voor de samenvoeging: { id: {niveau 0..1, kleur [r,g,b] lineair} }.
  function lichtVan(staat) {
    var uit = {};
    Object.keys(staat).forEach(function (id) {
      var l = staat[id];
      uit[id] = { niveau: l.aan ? klem((l.helderheid == null ? 100 : l.helderheid) / 100, 0, 1) : 0, kleur: lampKleurLineair(l) };
    });
    return uit;
  }

  /* ── scènes (voorlopig vaste presets) ── */

  var SCENES = {
    avond: { naam: 'Avond', groepen: { living_spots: [35, 2400], eettafel: [45, 2400], hal: [20, 2400], badkamer: [0], keuken_rail: [0], wc: [0] } },
    film:  { naam: 'Film',  groepen: { living_spots: [8, 2200], hal: [4, 2200], eettafel: [0], keuken_rail: [0], wc: [0], badkamer: [0] } },
    koken: { naam: 'Koken', groepen: { keuken_rail: [100, 4000], eettafel: [60, 3200], living_spots: [30, 3000], hal: [40, 3000], wc: [0], badkamer: [0] } },
    uit:   { naam: 'Alles uit', groepen: {} },
  };

  // Scène -> { lampId: {aan, helderheid, kelvin} } voor elke lamp zonder `volgt` (die volgen vanzelf).
  function scenePreset(naam, lampDefs) {
    var sc = SCENES[naam];
    if (!sc) throw new Error('onbekende scène: ' + naam);
    var uit = {};
    Object.keys(lampDefs).forEach(function (id) {
      if (lampDefs[id].volgt) return;
      var g = sc.groepen[lampDefs[id].groep];
      if (!g || !g[0]) uit[id] = { aan: false, helderheid: 0 };
      else uit[id] = { aan: true, helderheid: g[0], kelvin: g[1] };
    });
    return uit;
  }

  /* ── bediening ── */

  // De lamp (zonder `volgt`) het dichtst bij een tik, binnen `straalPx` op het beeld. x,y als fractie.
  function dichtsteLamp(lampDefs, x, y, breedte, hoogte, straalPx) {
    var best = null, bd = Infinity;
    Object.keys(lampDefs).forEach(function (id) {
      var l = lampDefs[id]; if (l.zichtbaar === false) return;
      var dx = (l.x - x) * breedte, dy = (l.y - y) * hoogte, d = Math.sqrt(dx * dx + dy * dy);
      if (d <= straalPx && d < bd) { bd = d; best = id; }
    });
    return best;
  }

  // Aanzichten uit lampen.json: ontbreekt "aanzichten" (of "achter"), dan enkel "voor" en dus geen draaiknop.
  function aanzichten(json) {
    var a = json && json.aanzichten;
    if (!a || !a.voor || !a.achter) return [{ naam: 'voor', map: '', label: 'Voor' }];
    return ['voor', 'achter'].map(function (n) { return { naam: n, map: a[n].map || '', label: a[n].label || n }; });
  }
  // De lampen voor één aanzicht: kamer/groep/volgt altijd uit "lampen", x en y uit aanzichten[naam].lampen (behalve "voor").
  // Een lamp die in het andere aanzicht niet staat (terwijl er wel een lijst is) krijgt zichtbaar:false.
  function lampenVoor(json, naam) {
    var uit = {}, a = json && json.aanzichten && naam !== 'voor' ? json.aanzichten[naam] : null, pos = a && a.lampen;
    Object.keys((json && json.lampen) || {}).forEach(function (id) {
      var l = json.lampen[id], c = {};
      Object.keys(l).forEach(function (k) { c[k] = l[k]; });
      if (pos) { if (pos[id]) { c.x = pos[id].x; c.y = pos[id].y; } else c.zichtbaar = false; }
      uit[id] = c;
    });
    return uit;
  }

  // Een geplakte Spotify-link (open.spotify.com/playlist/ID?si=...) wordt een spotify:-uri; al een uri of een andere url blijft staan.
  function spotifyUri(t) {
    t = String(t || '').trim();
    var m = /open\.spotify\.com\/(?:intl-[a-z]+\/)?(playlist|album|track|artist|show|episode)\/([A-Za-z0-9]+)/.exec(t);
    return m ? 'spotify:' + m[1] + ':' + m[2] : t;
  }

  /* ── zon, daglicht en nacht ── */

  var LAT = 51.22, LON = 4.40;                      // Antwerpen
  var RAD = Math.PI / 180;
  // Zonshoogte (graden boven de horizon, zonder refractie) en of het namiddag is. Standaardformule: declinatie, tijdvergelijking, uurhoek.
  function zonshoogte(datum, lat, lon) {
    lat = lat === undefined ? LAT : lat; lon = lon === undefined ? LON : lon;
    var d = new Date(datum.getTime()), jaar0 = Date.UTC(d.getUTCFullYear(), 0, 0);
    var n = Math.floor((d.getTime() - jaar0) / 86400000);                      // dag van het jaar
    var uurUtc = d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600;
    var g = 2 * Math.PI / 365 * (n - 1 + (uurUtc - 12) / 24);                 // fractionele jaarhoek
    var eot = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));   // min
    var decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
    var zonTijd = uurUtc * 60 + eot + 4 * lon;                                // ware zonnetijd in minuten
    var uurhoek = (zonTijd / 4 - 180) * RAD;
    var sinAlt = Math.sin(lat * RAD) * Math.sin(decl) + Math.cos(lat * RAD) * Math.cos(decl) * Math.cos(uurhoek);
    return { alt: Math.asin(klem(sinAlt, -1, 1)) / RAD, namiddag: uurhoek > 0 };
  }
  // Zonsondergang als minuten UTC op de dag van `datum` (UTC-datum): eerste keer na het middaguur dat de zon onder -0,83 graden komt.
  function zonsOndergangUtc(datum, lat, lon) {
    var basis = Date.UTC(datum.getUTCFullYear(), datum.getUTCMonth(), datum.getUTCDate());
    for (var m = 8 * 60; m < 24 * 60; m += 2) {
      var z = zonshoogte(new Date(basis + m * 60000), lat, lon);
      if (z.namiddag && z.alt < -0.83) return m;
    }
    return null;
  }
  // Voor de lokale klok: minuten sinds lokale middernacht, uit een Date.
  function zonsOndergangLokaal(datum, lat, lon) {
    var m = zonsOndergangUtc(datum, lat, lon);
    return m === null ? null : ((m - datum.getTimezoneOffset()) % 1440 + 1440) % 1440;
  }
  // Nachtscherm in rust: vanaf zonsondergang + 2 uur tot 07:00 (minuten sinds lokale middernacht).
  function nachtRust(minuten, ondergangMin) {
    var m = ((minuten % 1440) + 1440) % 1440, o = ondergangMin === null || ondergangMin === undefined ? 18 * 60 + 30 : ondergangMin;
    return m < 7 * 60 || m >= o + 120;
  }

  // De twee basislagen en hun mengverhouding bij een zonshoogte. a en b zijn namen: ochtend, dag, goud, avond, nacht; w = aandeel van b.
  // > 25 dag; 6 tot 25 dag naar goud (namiddag) of ochtend (voormiddag); 2 tot 6 goud/ochtend; -2 tot 2 naar avond (blauw uur); tot -6 avond; -6 tot -10 naar nacht.
  function basisMix(alt, namiddag) {
    var G = namiddag ? 'goud' : 'ochtend';
    if (alt >= 25) return { a: 'dag', b: 'dag', w: 0 };
    if (alt >= 6) return { a: 'dag', b: G, w: sm((25 - alt) / 19) };
    if (alt >= 2) return { a: G, b: G, w: 0 };
    if (alt >= -2) return { a: G, b: 'avond', w: sm((2 - alt) / 4) };
    if (alt >= -6) return { a: 'avond', b: 'avond', w: 0 };
    if (alt >= -10) return { a: 'avond', b: 'nacht', w: sm((-6 - alt) / 4) };
    return { a: 'nacht', b: 'nacht', w: 0 };
  }
  // Ontbreekt een laag, dan de eerstvolgende uit de keten (enkel dag/avond is de oude situatie).
  var BASIS_KETEN = { ochtend: ['ochtend', 'dag', 'avond'], dag: ['dag', 'avond'], goud: ['goud', 'dag', 'avond'], avond: ['avond', 'dag'], nacht: ['nacht', 'avond', 'dag'] };
  // Eerste beschikbare naam uit de keten; `weg(naam)` zegt of een laag niet bestaat. null als niets meer over is.
  function basisKiezen(naam, weg) {
    var k = BASIS_KETEN[naam] || [naam];
    for (var i = 0; i < k.length; i++) if (!weg(k[i])) return k[i];
    return null;

  function weerEffect(soort) {
    if (soort === 'regen') return { ds: 0.35, f: 0.85 };
    if (soort === 'bewolkt') return { ds: 0.25, f: 0.86 };
    return { ds: 0, f: 1 };
  }

  /* ── zoomen op een kamer ── */

  // CSS-transform voor de zoomlaag (transform-origin 0 0): het zwaartepunt (cx,cy als fractie) komt in het midden; de rand blijft gevuld.
  function zoomTransform(cx, cy, schaal, W, Hh) {
    var tx = W * (0.5 - cx * schaal), ty = Hh * (0.5 - cy * schaal);
    return { tx: klem(tx, W * (1 - schaal), 0), ty: klem(ty, Hh * (1 - schaal), 0), s: schaal };
  }
  // De kamer met het zwaartepunt het dichtst bij een punt (fracties); `kamers` is het resultaat van kamers().

  /* ── zoomen op een kamer ── */
  var zoomKamer = null, ZOOM = 2.2, zoomNu = 1;      // lagen zijn 1280x960: meer inzoomen wordt zichtbaar korrelig
  function zoomToepassen() {
